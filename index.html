<!doctype html>
<html lang="id">
<head>

<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --dim: #8b949e; --acc: #58a6ff; }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  main { max-width: 40rem; }
  h1 { font-size: 1.8rem; }
  h1 span { color: var(--acc); }
  p { color: var(--dim); margin: .8rem 0; }
  ul { list-style: none; padding: 0; margin: 1.2rem 0; }
  li { margin: .4rem 0; }
  li::before { content: "> "; color: var(--acc); }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 2rem; color: var(--dim); font-size: .85rem; }
</style>
</head>

<main>
  <h1>halo, gw <span>agoyeeee</span></h1>
  <p>dev & infra. seneng oprek server, otomasi, dan tooling buatan sendiri.</p>
  <ul>
    <li>linux & server ops</li>
    <li>automation / scripting</li>
    <li>self-hosted & homelab</li>
  </ul>
  <p>kontak: <a href="https://github.com/agoyeeee">github.com/agoyeeee</a></p>
  <footer>&copy; 2026 agoyeeee</footer>

</html>
